<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>cocollet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=Inter:wght@400&display=swap">
<!-- Charte Cocollet (dépôt Cocollet/brand), même origine. Les valeurs après la virgule ne servent que si elle manque. -->
<link rel="stylesheet" href="/brand/tokens.css">
<style>
  :root { --bg: var(--cc-bg, #121212); --mascot: var(--cc-amber, #ecb166); --eye: var(--cc-on-amber, #0a0a0a); --text: var(--cc-text, #e8e3da); --muted: var(--cc-text-muted, #8c857b); }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 48px 56px; box-sizing: border-box; }
  svg { width: clamp(120px, 26vmin, 220px); height: auto; }
  .face { fill: var(--mascot); }
  .eye { fill: var(--eye); }
  .eyes { transform-origin: 24px 23px; transition: transform 90ms ease-in; }
  .eyes.blink { transform: scaleY(0.12); }
  .slogan { text-align: center; display: flex; flex-direction: column; gap: 6px; }
  .slogan strong { font: 600 22px/1.2 Lora, Georgia, serif; color: var(--text); letter-spacing: -0.01em; }
  .slogan span { font: 400 13px/1.2 Inter, system-ui, sans-serif; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .eyes { transition: none; } }
</style>
</head>
<body>
  <svg viewBox="0 0 48 48" role="img" aria-label="Mascotte Cocollet qui dit bonjour">
    <rect class="face" x="6" y="6" width="36" height="36" rx="10"/>
    <g class="eyes">
      <circle class="eye" id="l" cx="17" cy="23" r="4"/>
      <circle class="eye" id="r" cx="31" cy="23" r="4"/>
    </g>
  </svg>
  <div class="slogan">
    <strong>Un seul compte pour les gouverner tous.</strong>
    <span>Photos · Livres · Outils</span>
  </div>
<script>
  // Eyes follow the pointer inside this frame; when the pointer leaves, they look right, toward the login form.
  const svg = document.querySelector("svg");
  const eyes = [{ el: document.getElementById("l"), cx: 17 }, { el: document.getElementById("r"), cx: 31 }];
  const MAX = 3.2, CY = 23;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let target = { x: MAX, y: 0 }, pos = { x: MAX, y: 0 };

  function aim(clientX, clientY) {
    const b = svg.getBoundingClientRect(), k = b.width / 48;
    const dx = clientX - (b.left + 24 * k), dy = clientY - (b.top + CY * k);
    const d = Math.hypot(dx, dy) || 1, m = Math.min(MAX, d / 40);
    target = { x: dx / d * m, y: dy / d * m };
  }
  addEventListener("pointermove", e => aim(e.clientX, e.clientY));
  document.documentElement.addEventListener("pointerleave", () => { target = { x: MAX, y: 0 }; });

  (function tick() {
    const f = reduce ? 1 : 0.18;
    pos.x += (target.x - pos.x) * f; pos.y += (target.y - pos.y) * f;
    eyes.forEach(e => { e.el.setAttribute("cx", (e.cx + pos.x).toFixed(2)); e.el.setAttribute("cy", (CY + pos.y).toFixed(2)); });
    requestAnimationFrame(tick);
  })();

  if (!reduce) {
    const g = document.querySelector(".eyes");
    (function blink() {
      setTimeout(() => { g.classList.add("blink"); setTimeout(() => { g.classList.remove("blink"); blink(); }, 140); }, 3500 + Math.random() * 4000);
    })();
  }
</script>
</body>
</html>
